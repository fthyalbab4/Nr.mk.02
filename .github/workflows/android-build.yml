name: Android build and host verification
on:
  push:
    paths:
      - 'app/**'
      - 'tools/**'
      - 'tests/**'
      - 'NOR_MAKER_COMPLETE_PACKAGE/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/**'
      - 'tests/**'
      - 'NOR_MAKER_COMPLETE_PACKAGE/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;25.2.9519653"
      - name: Run Python integration and security contracts
        run: python3 -m unittest discover -s tests/reference -p 'test_*.py' -v
      - name: Verify active core mirrors
        run: python3 tools/verify_core_mirrors.py
      - name: Run active-core host suite and four-game pipeline
        run: python3 tools/run_engine_suite.py
      - name: Run complete C package suite
        run: make -B -C NOR_MAKER_COMPLETE_PACKAGE/01_BLACKSCREEN_FIX test
      - name: Assemble Android Debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload installable Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nor-maker-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
