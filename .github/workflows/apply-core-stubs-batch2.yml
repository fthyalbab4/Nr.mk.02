name: apply-core-stubs-batch2
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply core stubs batch2
        run: |
          python3 tools/apply_core_stubs_batch2.py
          git config user.name "nor-bot"
          git config user.email "nor-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "core: implement code_*/path_*/match_*/string_* stubs batch2"
          git push
