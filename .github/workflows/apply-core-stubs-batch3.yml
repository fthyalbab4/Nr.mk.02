name: apply-core-stubs-batch3
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and apply batch3
        run: |
          python3 << 'PY'
          import base64, zlib
          from pathlib import Path
          b64 = open('tools/apply_core_stubs_batch3.b64').read().strip() if Path('tools/apply_core_stubs_batch3.b64').exists() else ''
          if not b64:
              raise SystemExit('missing b64 payload')
          Path('tools/apply_core_stubs_batch3.py').write_bytes(zlib.decompress(base64.b64decode(b64)))
          print('decoded ok')
          PY
          python3 tools/apply_core_stubs_batch3.py
          git config user.name "nor-bot"
          git config user.email "nor-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "core: clear GM82CORE stubs batch3"
          git push
