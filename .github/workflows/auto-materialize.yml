name: auto-materialize
on:
  push:
    branches: [main]
    paths:
      - 'tools/gap_fill_20261013/**'
      - '.github/workflows/auto-materialize.yml'
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: APPLY
        run: |
          python3 tools/gap_fill_20261013/APPLY_EXPORT_SCROLL_AND_SAVE.py || true
          python3 tools/gap_fill_20261013/APPLY_LANDSCAPE_NES_UI.py || true
          python3 tools/gap_fill_20261013/APPLY_MARIO_SENDKEY_FIX.py || true
          python3 tools/gap_fill_20261013/APPLY_MARIO_STEP_RECLASS.py || true
          python3 tools/gap_fill_20261013/APPLY_MARIO_TOUCH_CONTROLS.py || true
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-materialize export scroll/save"
          file_pattern: "app/src/main/assets/www/**"
