name: auto-materialize
on:
  push:
    branches: [main]
    paths:
      - 'tools/gap_fill_20261013/**'
      - 'tools/restore_gml_builtins_headers.py'
      - '.github/workflows/auto-materialize.yml'
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: APPLY
        run: |
          python3 tools/restore_gml_builtins_headers.py || true
          python3 tools/gap_fill_20261013/APPLY_HEADER_DS_MANY.py || true
          python3 tools/gap_fill_20261013/APPLY_P1_ACTIONS.py || true
          python3 tools/gap_fill_20261013/APPLY_PARITY_P0_RUNTIME.py || true
          python3 tools/gap_fill_20261013/APPLY_PRECISE_ROTATION_BAILOUT.py || true
          python3 tools/gap_fill_20261013/APPLY_HOST_PIPELINE_DUMP_JUMP.py || true
      - name: Host pipeline
        run: bash tools/run_host_pipeline.sh || echo soft-fail
      - name: Engine suite
        run: python3 tools/run_engine_suite.py || echo soft-fail
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: materialize host gapfills"
          file_pattern: "app/src/main/cpp/** tools/run_host_pipeline.sh docs/**"
