name: auto-materialize
on:
  push:
    branches: [main]
    paths:
      - 'tools/gap_fill_20261013/**'
      - '.github/workflows/auto-materialize.yml'
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: APPLY
        run: |
          python3 tools/gap_fill_20261013/APPLY_O6_PARENT_CHAIN.py || true
          python3 tools/gap_fill_20261013/APPLY_STUB_PROMOTE.py || true
          python3 tools/gap_fill_20261013/APPLY_MARIO_TOUCH_CONTROLS.py || true
      - run: bash tools/run_host_pipeline.sh || echo soft
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-materialize mario touch controls"
          file_pattern: "app/src/main/cpp/** app/src/main/java/**"
