name: auto-materialize
on:
  push:
    branches: [main]
    paths:
      - 'tools/gap_fill_20261013/**'
      - '.github/workflows/auto-materialize.yml'
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: APPLY
        run: |
          python3 tools/gap_fill_20261013/APPLY_PARITY_P0_RUNTIME.py || true
          python3 tools/gap_fill_20261013/APPLY_FIX_RUNNER_BLACK_SCREEN.py || true
          python3 tools/gap_fill_20261013/APPLY_EXPORT_SCROLL_AND_SAVE.py || true
          python3 tools/gap_fill_20261013/APPLY_JAVA_EXPORT_SAVE.py || true
      - name: Host pipeline
        run: bash tools/run_host_pipeline.sh || echo soft-fail
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: materialize parity P0 runtime restore"
          file_pattern: "app/src/main/cpp/** docs/**"
