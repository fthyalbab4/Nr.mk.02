name: auto-materialize
on:
  push:
    branches: [main]
    paths:
      - 'tools/gap_fill_20261013/**'
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Materialize + APPLY
        run: |
          python3 tools/gap_fill_20261013/ASSEMBLE_ACTIONS_PARTS.py || echo "no parts skip"
          python3 tools/gap_fill_20261013/MATERIALIZE_FROM_BLOBS.py || echo "materialize soft"
          python3 tools/gap_fill_20261013/APPLY_DND_EXTRAS.py || true
          python3 tools/gap_fill_20261013/APPLY_INSTANCE_IMAGE_FIELDS.py || true
          python3 tools/gap_fill_20261013/APPLY_ACTION_IMAGE_AND_LOG.py || true
          python3 tools/gap_fill_20261013/APPLY_DRAW_AND_DND2.py || true
          python3 tools/gap_fill_20261013/APPLY_DND_IF_ELSE.py
          python3 tools/gap_fill_20261013/VERIFY_AFTER_APPLY.py || echo "verify soft"
      - name: Host pipeline soft
        run: bash tools/run_host_pipeline.sh || echo "pipeline soft"
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-materialize + APPLY_DND_IF_ELSE on main"
          file_pattern: "app/src/main/cpp/** NOR_MAKER_COMPLETE_PACKAGE/**"
