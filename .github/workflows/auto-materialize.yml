name: auto-materialize
on:
  push:
    branches: [main]
    paths:
      - 'tools/gap_fill_20261013/**'
      - '.github/workflows/auto-materialize.yml'
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: APPLY merges
        run: |
          python3 tools/gap_fill_20261013/APPLY_SOURCE_MERGE_CORE.py || true
          python3 tools/gap_fill_20261013/APPLY_SOURCE_MERGE_BATCH2.py || true
          python3 tools/gap_fill_20261013/APPLY_EXEC_PLAN_20261026.py || true
          python3 tools/gap_fill_20261013/APPLY_REA_MOTION_BUILTINS.py || true
      - run: bash tools/run_host_pipeline.sh || echo soft
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-materialize source merge batch2"
          file_pattern: "app/src/main/cpp/**"
