name: apply-core-stubs-batch4

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore main from backup and close STUBS
        run: |
          set -e
          python3 tools/apply_core_stubs_batch4.py || true
          # Fallback inline if script still broken
          python3 -c "
from pathlib import Path
ROOT=Path('.').resolve()
bak=ROOT/'app/src/main/cpp_backup/src/gm82_gml_builtins.c'
main=ROOT/'app/src/main/cpp/src/gm82_gml_builtins.c'
if bak.exists():
    t=main.read_text(encoding='utf-8',errors='replace') if main.exists() else ''
    if 'PLACEHOLDER' in t or 'GM82CORE_STUBS' not in t or len(t)<5000:
        main.write_bytes(bak.read_bytes())
        print('restored main builtins')
print('fallback done')
"
          git config user.name "batch4-bot"
          git config user.email "batch4@users.noreply.github.com"
          git add -A
          git status
          git commit -m "batch4: restore main builtins from backup if PLACEHOLDER" || echo nothing
          git push origin HEAD || true
