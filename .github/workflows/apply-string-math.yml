name: apply-string-math
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Materialize blobs
        run: |
          python3 tools/gap_fill_20261013/MATERIALIZE_FROM_BLOBS.py
          python3 tools/gap_fill_20261013/VERIFY_AFTER_APPLY.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: materialize gap-fill from blobs"
          file_pattern: "app/src/main/cpp/** NOR_MAKER_COMPLETE_PACKAGE/**"
