name: apply-string-math
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: APPLY_ALL_SEQUENTIAL
        run: bash tools/gap_fill_20261013/APPLY_ALL_SEQUENTIAL.sh
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: APPLY_ALL_SEQUENTIAL materialize gap-fill on tree"
          file_pattern: "app/src/main/cpp/** NOR_MAKER_COMPLETE_PACKAGE/**"
