name: land-pr192
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply PR192 unique injects
        run: python3 tools/gap_fill_20261013/APPLY_PR192_UNIQUE.py
      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: APPLY_PR192_UNIQUE hypot/clamp/lerp + headers"
          file_pattern: |
            app/src/main/cpp/**
            app/src/main/cpp_backup/**
            NOR_MAKER_COMPLETE_PACKAGE/01_BLACKSCREEN_FIX/**
