name: apply-host-gaps
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply gapfill and keyDown
        run: |
          python3 tools/apply_actions_gapfill.py
          python3 tools/apply_keydown_bridge.py
          git config user.name "nor-bot"
          git config user.email "nor-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "apply host gapfill + keyDown (workflow)"
          git push
