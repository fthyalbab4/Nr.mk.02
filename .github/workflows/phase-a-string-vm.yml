name: phase-a-string-vm
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/gap_fill_20261013/APPLY_STRING_VM_CALLS.py'
      - 'tools/gap_fill_20261013/phase_a_eval_keyboard_string.patch'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Engine regression suite
        run: python3 tools/run_engine_suite.py
      - name: Reference and security contracts
        run: python3 -m unittest discover -s tests/reference -p 'test_*.py' -v
      - name: Ensure verification did not mutate the checkout
        run: git diff --exit-code
