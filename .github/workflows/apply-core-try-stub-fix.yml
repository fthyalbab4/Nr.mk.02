name: apply-core-try-stub-fix
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply core try_stub fix
        run: |
          python3 tools/apply_core_try_stub_fix.py
          git config user.name "nor-bot"
          git config user.email "nor-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "core: stop try_stub shadowing real GML handlers + move_and_collide"
          git push
