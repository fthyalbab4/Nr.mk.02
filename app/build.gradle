plugins {
    id 'com.android.application'
}

android {
    namespace 'com.normaker.nativefull'
    compileSdk 34
    ndkVersion '25.2.9519653'
    def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
    def releaseKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
    def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
    def releaseSigningConfigured = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword].every { it }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.normaker.nativefull.ulalqd'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            // Android Gradle Plugin provisions its non-production debug keystore locally.
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = []
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }
}
