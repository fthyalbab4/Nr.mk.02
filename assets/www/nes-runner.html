<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>NOR Maker — NES Runner UI</title>
  <link rel="stylesheet" href="runner-emu-ref.css" />
  <link rel="stylesheet" href="runner-landscape-nes.css" />
</head>
<body>
  <div class="nes-emu-root" id="nesRoot">
    <div class="nes-emu-layout">

      <!-- Left: SELECT/START + D-Pad -->
      <div class="nes-pillar-left">
        <div class="nes-select-start-deck">
          <button type="button" class="nes-pill-btn" data-btn="select">SELECT</button>
          <button type="button" class="nes-pill-btn" data-btn="start">START</button>
        </div>

        <div class="nes-dpad-wrap" id="dpad">
          <div class="nes-dpad-arm nes-dpad-up" data-btn="up"><span class="nes-arrow-icon">▲</span></div>
          <div class="nes-dpad-arm nes-dpad-down" data-btn="down"><span class="nes-arrow-icon">▼</span></div>
          <div class="nes-dpad-arm nes-dpad-left" data-btn="left"><span class="nes-arrow-icon">◀</span></div>
          <div class="nes-dpad-arm nes-dpad-right" data-btn="right"><span class="nes-arrow-icon">▶</span></div>
          <div class="nes-dpad-center">
            <div class="nes-dpad-pivot-circle"></div>
          </div>
        </div>

        <div class="nes-ntsc-tag">NTSC</div>
      </div>

      <!-- Center: 4:3 game surface -->
      <div class="nes-center-stage">
        <div class="nes-game-frame" id="gameFrame">
          <canvas id="gameCanvas" width="320" height="240" style="width:100%;height:100%;image-rendering:pixelated;background:#000;"></canvas>
        </div>
      </div>

      <!-- Right: menu + A/B -->
      <div class="nes-pillar-right">
        <div class="nes-top-menu">
          <button type="button" class="nes-menu-btn" data-btn="menu" title="Menu">⋮</button>
        </div>

        <div class="nes-action-deck">
          <div class="nes-action-plate">
            <button type="button" class="nes-action-btn" data-btn="b">B</button>
          </div>
          <div class="nes-action-plate">
            <button type="button" class="nes-action-btn" data-btn="a">A</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    (function () {
      function setActive(el, on) {
        if (!el) return;
        el.classList.toggle('is-active', !!on);
      }
      function bindPress(el) {
        if (!el) return;
        var down = function (e) { e.preventDefault(); setActive(el, true); };
        var up = function (e) { e.preventDefault(); setActive(el, false); };
        el.addEventListener('pointerdown', down);
        el.addEventListener('pointerup', up);
        el.addEventListener('pointerleave', up);
        el.addEventListener('pointercancel', up);
      }
      document.querySelectorAll('[data-btn]').forEach(bindPress);

      var root = document.getElementById('nesRoot');
      var menu = document.querySelector('[data-btn="menu"]');
      if (menu) {
        menu.addEventListener('click', function () {
          root.classList.toggle('is-fullscreen');
        });
      }
    })();
  </script>
</body>
</html>
